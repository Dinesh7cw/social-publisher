# Production stack for CW Social Publisher.
#
# Three processes and two stateful services:
#   app      - Next.js web (the UI and the API)
#   worker   - BullMQ consumer (publishing). Separate so a publish stall cannot
#              take the UI down, and so it can be restarted independently.
#   migrate  - one-shot Prisma migrate deploy, run before app and worker start.
#   postgres - system of record
#   redis    - job queue (AOF on, so scheduled jobs survive a restart)
#
# Secrets come from an env file that is never committed. See docs/DEPLOYMENT.md.
#
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d

name: cw-social

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 20
    # Not published to the host: only the app and worker reach it.

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
    # appendonly + noeviction: a scheduled post must never be evicted, and the
    # brief requires jobs to survive a restart.
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory-policy
      - noeviction
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20

  migrate:
    build: .
    image: cw-social-app:latest
    command: ["pnpm", "prisma", "migrate", "deploy"]
    env_file: .env.production
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  app:
    build: .
    image: cw-social-app:latest
    restart: unless-stopped
    env_file: .env.production
    ports:
      - "3010:3010"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3010/api/health"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  worker:
    build: .
    image: cw-social-app:latest
    restart: unless-stopped
    command: ["pnpm", "worker"]
    env_file: .env.production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # Publishing is CPU-light but latency-sensitive; one worker with modest
    # concurrency is enough for an agency's volume.
    deploy:
      resources:
        limits:
          memory: 768M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # TLS termination. Put real certificates in ./certs (see docs/DEPLOYMENT.md).
  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      app:
        condition: service_started

volumes:
  postgres-data:
  redis-data:
