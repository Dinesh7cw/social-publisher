# Reverse proxy for CW Social Publisher.
#
# Terminates TLS, forwards to the app, and sets the headers the app relies on for
# its origin check (a request arriving via the proxy must present the public
# origin, which APP_ORIGIN is set to in .env.production).

upstream cw_app {
    server app:3010;
    keepalive 32;
}

# Redirect all plain HTTP to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Let an ACME challenge through for certificate renewal.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # Modern, compatible profile.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Media uploads go straight to object storage, so the app never needs a large
    # body. A 2MB ceiling closes an easy denial-of-service path.
    client_max_body_size 2m;

    # Do not advertise the nginx version.
    server_tokens off;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # A light rate limit at the edge, on top of the app's own per-user limits.
    limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;

    location /api/auth/ {
        limit_req zone=auth burst=5 nodelay;
        proxy_pass http://cw_app;
        include /etc/nginx/proxy_params_cw;
    }

    location / {
        proxy_pass http://cw_app;
        include /etc/nginx/proxy_params_cw;
    }
}
